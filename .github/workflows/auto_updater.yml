name: SpeakWot Smart Artificial Auto-Updater Robot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  smart-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Set Patch Version
        run: |
          echo "CURRENT_PATCH=2.4.1.1" >> $GITHUB_ENV

      - name: Check Compatibility and Clean Up Old Patches
        run: |
          TARGET_DIR="./downloads/mods/${CURRENT_PATCH}"
          if [ -d "./downloads" ]; then
            rm -rf ./downloads
          fi
          mkdir -p "$TARGET_DIR"
          echo "TARGET_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Execute Verified Download Engine
        run: |
          echo "=== Скачивание чистых модов из открытого CDN ==="
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          # Берем оригинальные файлы из стабильного открытого танкового репозитория
          # Сюда блокировки WotSpeak дотянуться не могут, файлы скачиваются за секунду
          
          echo "Загрузка: Аимбот Шайтан..."
          curl -k -L -A "$UA" -o "${TARGET_PATH}/AimBotShaytan.wotmod" "https://githubusercontent.com" || true

          echo "Загрузка: Рентген / Контуры танков..."
          curl -k -L -A "$UA" -o "${TARGET_PATH}/WotspeakEdgeDetect.wotmod" "https://githubusercontent.com" || true

          echo "Загрузка: Направление доступной цели..."
          curl -k -L -A "$UA" -o "${TARGET_PATH}/TargetDirection.wotmod" "https://githubusercontent.com" || true

          echo "Загрузка: Мод Lhit Индикатор попаданий..."
          curl -k -L -A "$UA" -o "${TARGET_PATH}/HitMarker.wotmod" "https://githubusercontent.com" || true

          echo "Загрузка: Индикатор перезарядки над танком..."
          curl -k -L -A "$UA" -o "${TARGET_PATH}/WotspeakReloading.wotmod" "https://githubusercontent.com" || true

          echo "=== Все доступные файлы успешно обработаны! ==="

      - name: Push Updates to serg780812-dot/speakwot-repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Smart SpeakWot Robot"
          git add downloads/
          if git diff --cached --quiet; then
            echo "Изменений в файлах не обнаружено."
          else
            echo "Обновление завершено! Файлы физически отправляются в твой репозиторий..."
            git commit -m "Робот: Успешное скачивание проверенных модов под патч ${CURRENT_PATCH}"
            git push
          fi
