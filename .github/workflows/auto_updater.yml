          curl -k -L -s -A "$UA" -o "${TARGET_PATH}/WoDO.wotmod" "${WOTSPEAK_CHEATS}WoDO.wotmod" || true
          curl -k -L -s -A "$UA" -o "${TARGET_PATH}/WoMT.wotmod" "${WOTSPEAK_CHEATS}WoMT.wotmod" || true
