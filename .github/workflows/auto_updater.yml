===================================================================================
# SPEAKWOT SMART AUTONOMOUS AUTO-UPDATER MASTER WORKFLOW (WG / EU VERSION - MAX BUILD)
# Max Build: Headless Chrome Browser Emulation with Selenium anti-bot bypass engine
# ====================================================================================

name: SpeakWot Smart Artificial Auto-Updater Robot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  smart-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome and Selenium Driver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable unzip
          pip install selenium webdriver-manager

      - name: Check Compatibility and Clean Up Old Patches
        run: |
          TARGET_DIR="./downloads/mods/2.4.1.1"
          if [ -d "./downloads" ]; then
            rm -rf ./downloads
          fi
          mkdir -p "$TARGET_DIR"
          echo "TARGET_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Run Selenium Headless Browser Engine
        run: |
          python - <<EOF
          import os
          import time
          import glob
          import shutil
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          # Настройка скрытого браузера Chrome
          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          
          # Эмуляция реального пользователя
          options.add_argument("user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          
          # Настройка папки для автоматического скачивания файлов внутри гитхаба
          download_dir = os.path.abspath("./chrome_downloads")
          os.makedirs(download_dir, exist_ok=True)
          prefs = {"download.default_directory": download_dir}
          options.add_experimental_option("prefs", prefs)

          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)

          # Твой список ссылок с таймерами ожидания
          links = [
              "https://wotspeak.org",
              "https://wotspeak.org",
              "https://wotspeak.org",
              "https://wotspeak.org",
              "https://wotspeak.org"
          ]

          target_path = os.environ['TARGET_PATH']

          for idx, url in enumerate(links, 1):
              print(f" Браузер открывает ссылку мода №{idx}...")
              driver.get(url)
              
              # ЖДЕМ 12 СЕКУНД (Пока тикает таймер Wotspeak и начинается загрузка)
              print(" Ожидание прохождения таймера защиты сайта (12 сек)...")
              time.sleep(12)

          # Даем финальные 5 секунд, чтобы все файлы докачались на диск
          time.sleep(5)
          driver.quit()

          # Проверяем, что скачалось в папку браузера
          downloaded_files = glob.glob(os.path.join(download_dir, "*"))
          print(f"Всего файлов успешно выкачано через Chrome: {len(downloaded_files)}")

          # Переносим скачанные архивы в рабочую папку для распаковки
          for f in downloaded_files:
              shutil.move(f, "./")
          EOF

      - name: Extract Extracted Archives with 7-Zip
        run: |
          echo "=== Распаковка скачанных браузером архивов ==="
          mkdir -p ./temp_out
          
          # Распаковываем абсолютно все скачанные через Chrome .zip и .rar архивы
          for archive in *.zip *.rar; do
            if [ -f "$archive" ]; then
              echo "Распаковка файла: $archive"
              7z x "$archive" -o./temp_out -y || true
            fi
          done

          # Извлекаем чистые .wotmod файлы и переносим их в твою финальную папку патча
          find ./temp_out -name "*.wotmod" -exec cp {} "${TARGET_PATH}/" \;
          
          # Полная очистка мусора на сервере
          rm -rf ./temp_out ./chrome_downloads *.zip *.rar
          echo "Все чистые .wotmod файлы успешно отсортированы!"

      - name: Push Updates to serg780812-dot/speakwot-repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Smart SpeakWot Robot"
          
          # Физически сохраняем скачанные файлы в твой репозиторий
          git add downloads/
          
          if git diff --cached --quiet; then
            echo "Изменений в модах не обнаружено."
          else
            echo "Обновление завершено! Настоящие моды отправляются в репозиторий..."
            git commit -m "Робот: Успешный обход таймера Wotspeak через Headless Chrome"
            git push
          fi
