# ====================================================================================
# SPEAKWOT SMART AUTONOMOUS AUTO-UPDATER MASTER WORKFLOW (WG / EU VERSION - MAX BUILD)
# GitHub Action: Absolutely Full, Non-Truncated & Stable Multi-Server Download Engine
# ====================================================================================

name: SpeakWot Smart Artificial Auto-Updater Robot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  smart-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Automatically Detect Patch & Build Direct Dynamic Links
        id: parse-engine
        run: |
          python - <<EOF
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          target_url = "https://wotsite.net"
          
          detected_patch = "2.4.1.1"
          download_url = ""

          try:
              res = requests.get(target_url, headers={"User-Agent": UA}, timeout=15)
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, 'html.parser')
                  versions = re.findall(r'\b(?:1|2)\.\d{2}\.\d\.\d\b', soup.get_text())
                  if versions:
                      detected_patch = versions[0]
                  
                  for a in soup.find_all('a', href=True):
                      href = a['href']
                      if ('download' in href or 'andre' in href.lower()) and (href.endswith('.zip') or href.endswith('.exe') or 'mcloud' in href):
                          download_url = href if href.startswith('http') else "https://wotsite.net" + href
                          break
          except Exception as e:
              print(f"Error parsing: {e}")

          if not download_url:
              download_url = f"https://wotsite.net_{detected_patch}.zip"

          print(f"PATCH_FOUND: {detected_patch}")
          print(f"LINK_FOUND: {download_url}")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"CURRENT_PATCH={detected_patch}\n")
              f.write(f"ANDRE_URL={download_url}\n")
          EOF

      - name: Check Compatibility and Clean Up Old Patches
        run: |
          echo "=== Проверка совместимости и тотальная очистка старых папок ==="
          TARGET_DIR="./downloads/mods/${CURRENT_PATCH}"
          if [ -d "./downloads" ]; then
            rm -rf ./downloads
          fi
          mkdir -p "$TARGET_DIR"
          echo "TARGET_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Execute Multi-Server Smart Download Engine (Categories 1-3)
        run: |
          echo "=== Скачивание базовых системных модов под патч: ${CURRENT_PATCH} ==="
          CHAMPI_URL="https://champi.de{CURRENT_PATCH}/"
          PROTANKI_URL="https://protanki.tv{CURRENT_PATCH}/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          curl -L -s -A "$UA" -o "${TARGET_PATH}/OpenModsCore.wotmod" "${CHAMPI_URL}OpenModsCore.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/izeberg.vehicle_exp.wotmod" "${CHAMPI_URL}izeberg.vehicle_exp.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/izeberg.repair.wotmod" "${CHAMPI_URL}izeberg.repair.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/izeberg.reload_timer.wotmod" "${CHAMPI_URL}izeberg.reload_timer.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/izeberg.spotted.wotmod" "${CHAMPI_URL}izeberg.spotted.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/armor.ScriptLoader.wotmod" "${CHAMPI_URL}armor.ScriptLoader.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/pruszko.dispersion_reticle_3.1.4.wotmod" "${CHAMPI_URL}pruszko.dispersion_reticle_3.1.4.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/pruszko.achievement_notification_1.2.5.wotmod" "${CHAMPI_URL}pruszko.achievement_notification_1.2.5.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/tv.protanki.stuff_8.1.07.wotmod" "${PROTANKI_URL}tv.protanki.stuff_8.1.07.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/tv.protanki.spotted_8.0.04.wotmod" "${PROTANKI_URL}tv.protanki.spotted_8.0.04.wotmod" || true

      - name: Smart Unpack Engine - Andre_V Sound Pack (Category 4)
        run: |
          echo "=== Загрузка и распаковка архива озвучек ==="
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          curl -L -A "$UA" -e "https://wotsite.net" --connect-timeout 60 --retry 3 -o "andre_v_temp.zip" "${ANDRE_URL}"

          if [ -f "andre_v_temp.zip" ]; then
            mkdir -p ./temp_unpack
            unzip -q andre_v_temp.zip -d ./temp_unpack || 7z x andre_v_temp.zip -o./temp_unpack -y
            find ./temp_unpack -name "*.wotmod" -exec cp {} "${TARGET_PATH}/" \;
            rm -rf ./temp_unpack
            rm -f andre_v_temp.zip
            echo "Все озвучки от Andre_V успешно извлечены!"
          else
            echo "Ошибка: Архив озвучек не загружен."
          fi

      - name: Execute Cheat Download Engine - WotSpeak Core (Category 5)
        run: |
          echo "=== Загрузка списка читов (Категория 5) ==="
          CHEAT_CDN="https://champi.de{CURRENT_PATCH}/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          curl -L -s -A "$UA" -o "${TARGET_PATH}/Tundra.wotmod" "${CHEAT_CDN}Tundra.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoAA.wotmod" "${CHEAT_CDN}WoAA.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoRP.wotmod" "${CHEAT_CDN}WoRP.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoRX.wotmod" "${CHEAT_CDN}WoRX.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoAD.wotmod" "${CHEAT_CDN}WoAD.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoH.wotmod" "${CHEAT_CDN}WoH.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoLP.wotmod" "${CHEAT_CDN}WoLP.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoRM.wotmod" "${CHEAT_CDN}WoRM.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoTD.wotmod" "${CHEAT_CDN}WoTD.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoDO.wotmod" "${CHEAT_CDN}WoDO.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoMT.wotmod" "${CHEAT_CDN}WoMT.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoAR.wotmod" "${CHEAT_CDN}WoAR.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoDS.wotmod" "${CHEAT_CDN}WoDS.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoGS.wotmod" "${CHEAT_CDN}WoGS.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/mod_aim_drw.wotmod" "${CHEAT_CDN}mod_aim_drw.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/mod_xray_drw.wotmod" "${CHEAT_CDN}mod_xray_drw.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoSS.wotmod" "${CHEAT_CDN}WoSS.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoDOT.wotmod" "${CHEAT_CDN}WoDOT.wotmod" || true
          curl -L -s -A "$UA" -o "${TARGET_PATH}/WoRT.wotmod" "${CHEAT_CDN}WoRT.wotmod" || true

      - name: Push Updates to serg780812-dot/speakwot-repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Smart SpeakWot Robot"
          git add downloads/
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Робот: Авто-обновление под патч ${CURRENT_PATCH}"
            git push
          fi
