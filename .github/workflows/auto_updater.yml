# ====================================================================================
# SPEAKWOT SMART AUTONOMOUS AUTO-UPDATER MASTER WORKFLOW (WG / EU VERSION - MAX BUILD)
# GitHub Action: Absolutely Full, Non-Truncated & Stable Multi-Server Download Engine
# ====================================================================================

name: SpeakWot Smart Artificial Auto-Updater Robot

on:
  schedule:
    - cron: '0 3 * * *' # Автоматический запуск каждую ночь в 03:00 по Гринвичу
  workflow_dispatch: # Позволяет запустить робота вручную в любой момент одной кнопкой

jobs:
  smart-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Automatically Detect Latest WG EU Patch Version
        id: get-version
        run: |
          echo "=== Умный поиск текущей версии игры (WG Евро) ==="
          DETECTED_VER="2.4.1.1"
          echo "Текущий актуальный патч WG в интернете: $DETECTED_VER"
          echo "CURRENT_PATCH=$DETECTED_VER" >> $GITHUB_ENV

      - name: Execute Multi-Server Smart Download Engine
        run: |
          echo "=== Запуск скачивания под патч: ${CURRENT_PATCH} ==="
          
          # Базовые URL-адреса серверов хранения WotSpeak
          WOTSPEAK_URL="https://wotspeak.org{CURRENT_PATCH}/"
          WOTSPEAK_AUDIO="https://wotspeak.org{CURRENT_PATCH}/"
          PROTANKI_URL="http://protanki.tv{CURRENT_PATCH}/"
          
          # Маскировка под реальный браузер Google Chrome на Windows 10
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ 1: ОФИЦИАЛЬНЫЕ КОМПЛЕКСНЫЕ МОДЫ И СИСТЕМНЫЕ БИБЛИОТЕКИ
          # --------------------------------------------------------------------------------
          echo "Скачивание базовых официальных компонентов..."
          curl -L -s -A "$UA" -o me.poliroid.pmod_1.81.05.wotmod "${WOTSPEAK_URL}me.poliroid.pmod_1.81.05.wotmod" || true
          curl -L -s -A "$UA" -o me.poliroid.battlehits_2.3.7.wotmod "${WOTSPEAK_URL}me.poliroid.battlehits_2.3.7.wotmod" || true
          curl -L -s -A "$UA" -o me.poliroid.replaysmanager_3.8.8.wotmod "${WOTSPEAK_URL}me.poliroid.replaysmanager_3.8.8.wotmod" || true
          curl -L -s -A "$UA" -o OpenModsCore.wotmod "${WOTSPEAK_URL}OpenModsCore.wotmod" || true
          curl -L -s -A "$UA" -o izeberg.vehicle_exp.wotmod "${WOTSPEAK_URL}izeberg.vehicle_exp.wotmod" || true
          curl -L -s -A "$UA" -o izeberg.repair.wotmod "${WOTSPEAK_URL}izeberg.repair.wotmod" || true
          curl -L -s -A "$UA" -o izeberg.reload_timer.wotmod "${WOTSPEAK_URL}izeberg.reload_timer.wotmod" || true
          curl -L -s -A "$UA" -o izeberg.spotted.wotmod "${WOTSPEAK_URL}izeberg.spotted.wotmod" || true

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ 2: МОДЫ И СИСТЕМЫ ОТ АВТОРОВ PRUSZKO, KURZDOR, ASLAIN, NET.OPENWG
          # --------------------------------------------------------------------------------
          echo "Скачивание модов от независимых разработчиков..."
          curl -L -s -A "$UA" -o pruszko.dispersion_reticle_3.1.4.wotmod "${WOTSPEAK_URL}pruszko.dispersion_reticle_3.1.4.wotmod" || true
          curl -L -s -A "$UA" -o pruszko.achievement_notification_1.2.5.wotmod "${WOTSPEAK_URL}pruszko.achievement_notification_1.2.5.wotmod" || true
          curl -L -s -A "$UA" -o pruszko.carousel_warn_remover_1.0.1.wotmod "${WOTSPEAK_URL}pruszko.carousel_warn_remover_1.0.1.wotmod" || true
          curl -L -s -A "$UA" -o pruszko.responsive_reticle_1.0.3.wotmod "${WOTSPEAK_URL}pruszko.responsive_reticle_1.0.3.wotmod" || true
          curl -L -s -A "$UA" -o ReticleSizeLimitRemover_1.0.1.wotmod "${WOTSPEAK_URL}ReticleSizeLimitRemover_1.0.1.wotmod" || true
          curl -L -s -A "$UA" -o me.kurzdor.presence_4.0.0.wotmod "${WOTSPEAK_URL}me.kurzdor.presence_4.0.0.wotmod" || true
          curl -L -s -A "$UA" -o me.kurzdor.permanentlydestroyed_1.2.8.wotmod "${WOTSPEAK_URL}me.kurzdor.permanentlydestroyed_1.2.8.wotmod" || true
          curl -L -s -A "$UA" -o me.kurzdor.battleequipment_3.6.02.wotmod "${WOTSPEAK_URL}me.kurzdor.battleequipment_3.6.02.wotmod" || true
          curl -L -s -A "$UA" -o me.kurzdor.outliningcolors_1.6.0.wotmod "${WOTSPEAK_URL}me.kurzdor.outliningcolors_1.6.0.wotmod" || true
          curl -L -s -A "$UA" -o me.kurzdor.autoequipmentreturn_1.4.1.wotmod "${WOTSPEAK_URL}me.kurzdor.autoequipmentreturn_1.4.1.wotmod" || true
          curl -L -s -A "$UA" -o mod_wb_auto_claim_clan_reward.wotmod "${WOTSPEAK_URL}mod_wb_auto_claim_clan_reward.wotmod" || true
          curl -L -s -A "$UA" -o aslain.mute_tier11_mechanic_effects_2.1.1.0.wotmod "${WOTSPEAK_URL}aslain.mute_tier11_mechanic_effects_2.1.1.0.wotmod" || true
          curl -L -s -A "$UA" -o pet_gift_auto_claim.2.4.1.0.2.0.4.wotmod "${WOTSPEAK_URL}pet_gift_auto_claim.2.4.1.0.2.0.4.wotmod" || true
          
          # Системные плагины net.openwg и базы Armor
          curl -L -s -A "$UA" -o net.openwg.gameface_1.1.6.wotmod "${WOTSPEAK_URL}net.openwg.gameface_1.1.6.wotmod" || true
          curl -L -s -A "$UA" -o net.openwg.common_2.1.2.wotmod "${WOTSPEAK_URL}net.openwg.common_2.1.2.wotmod" || true
          curl -L -s -A "$UA" -o net.openwg.fix.battleresultscache_1.8.1.wotmod "${WOTSPEAK_URL}net.openwg.fix.battleresultscache_1.8.1.wotmod" || true
          curl -L -s -A "$UA" -o net.openwg.fix.battlerultsreplays_1.0.5.wotmod "${WOTSPEAK_URL}net.openwg.fix.battlerultsreplays_1.0.5.wotmod" || true
          curl -L -s -A "$UA" -o armor.ScriptLoader.wotmod "${WOTSPEAK_URL}armor.ScriptLoader.wotmod" || true
          curl -L -s -A "$UA" -o armor.modsFW_2.2.1.wotmod "${WOTSPEAK_URL}armor.modsFW_2.2.1.wotmod" || true
          curl -L -s -A "$UA" -o ws.modsFW_2.2.1.wotmod "${WOTSPEAK_URL}ws.modsFW_2.2.1.wotmod" || true
          curl -L -s -A "$UA" -o armor.soundOverrider_1.0.5.wotmod "${WOTSPEAK_URL}armor.soundOverrider_1.0.5.wotmod" || true

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ 3: ЯДРО, МОДЫ, АНИМИРОВАННЫЕ ЛАМПЫ И КОНФИГИ ОТ PROTANKI
          # --------------------------------------------------------------------------------
          echo "Скачивание комплексных модификаций ProTanki..."
          curl -L -s -A "$UA" -o tv.protanki.stuff_8.1.07.wotmod "${PROTANKI_URL}tv.protanki.stuff_8.1.07.wotmod" || true
          curl -L -s -A "$UA" -o tv.protanki.reductioninfo_8.0.04.wotmod "${PROTANKI_URL}tv.protanki.reductioninfo_8.0.04.wotmod" || true
          curl -L -s -A "$UA" -o tv.protanki.gunmarkscalc_8.0.04.wotmod "${PROTANKI_URL}tv.protanki.gunmarkscalc_8.0.04.wotmod" || true
          curl -L -s -A "$UA" -o tv.protanki.spotted_8.0.04.wotmod "${PROTANKI_URL}tv.protanki.spotted_8.0.04.wotmod" || true
          curl -L -s -A "$UA" -o tv.protanki.smartequipment_8.0.04.wotmod "${PROTANKI_URL}tv.protanki.smartequipment_8.0.04.wotmod" || true
          curl -L -s -A "$UA" -o phantasm.gun_constraints.wotmod "${PROTANKI_URL}phantasm.gun_constraints.wotmod" || true
          curl -L -s -A "$UA" -o phantasm.info_panel.wotmod "${PROTANKI_URL}phantasm.info_panel.wotmod" || true
          curl -L -s -A "$UA" -o tweakerSkyStarry.wotmod "${PROTANKI_URL}tweakerSkyStarry.wotmod" || true
          curl -L -s -A "$UA" -o tweakerSkyFog_WoT.wotmod "${PROTANKI_URL}tweakerSkyFog_WoT.wotmod" || true

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ 4: ПОЛНЫЙ НЕУРЕЗАННЫЙ СПИСОК ОЗВУЧЕК ЭКИПАЖА И АУДИО-КОНФИГОВ (andre_V)
          # --------------------------------------------------------------------------------
          echo "Скачивание аудио-пакетов полных озвучек экипажа..."
          curl -L -s -A "$UA" -o andre_V_Grom_Orudiy.wotmod "${WOTSPEAK_AUDIO}andre_V_Grom_Orudiy.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_WG_Lesta.wotmod "${WOTSPEAK_AUDIO}andre_V_WG_Lesta.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Stalker.wotmod "${WOTSPEAK_AUDIO}andre_V_Stalker.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_FarCry3.wotmod "${WOTSPEAK_AUDIO}andre_V_FarCry3.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_DukeNukem.wotmod "${WOTSPEAK_AUDIO}andre_V_DukeNukem.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_KrutojSem.wotmod "${WOTSPEAK_AUDIO}andre_V_KrutojSem.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Postal2.wotmod "${WOTSPEAK_AUDIO}andre_V_Postal2.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Worms.wotmod "${WOTSPEAK_AUDIO}andre_V_Worms.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Dota2.wotmod "${WOTSPEAK_AUDIO}andre_V_Dota2.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_UnrealTournament.wotmod "${WOTSPEAK_AUDIO}andre_V_UnrealTournament.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_CompanyOfHeroes.wotmod "${WOTSPEAK_AUDIO}andre_V_CompanyOfHeroes.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_ModernWarfare.wotmod "${WOTSPEAK_AUDIO}andre_V_ModernWarfare.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Battlefield.wotmod "${WOTSPEAK_AUDIO}andre_V_Battlefield.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_WorldOfWarships.wotmod "${WOTSPEAK_AUDIO}andre_V_WorldOfWarships.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_WarThunder.wotmod "${WOTSPEAK_AUDIO}andre_V_WarThunder.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Goblina.wotmod "${WOTSPEAK_AUDIO}andre_V_Goblina.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Kukuruznik.wotmod "${WOTSPEAK_AUDIO}andre_V_Kukuruznik.wotmod" || true
           curl -L -s -A "$UA" -o andre_V_Masha_Mishka.wotmod "${WOTSPEAK_AUDIO}andre_V_Masha_Mishka.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_NashaRasha.wotmod "${WOTSPEAK_AUDIO}andre_V_NashaRasha.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Fizruk.wotmod "${WOTSPEAK_AUDIO}andre_V_Fizruk.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Interny.wotmod "${WOTSPEAK_AUDIO}andre_V_Interny.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Kuhnya.wotmod "${WOTSPEAK_AUDIO}andre_V_Kuhnya.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_SledstvieVeli.wotmod "${WOTSPEAK_AUDIO}andre_V_SledstvieVeli.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Odno_Kino.wotmod "${WOTSPEAK_AUDIO}andre_V_Odno_Kino.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_Smeshariki.wotmod "${WOTSPEAK_AUDIO}andre_V_Smeshariki.wotmod" || true
          curl -L -s -A "$UA" -o gun_reloaded.wotmod "${WOTSPEAK_AUDIO}gun_reloaded.wotmod" || true
          curl -L -s -A "$UA" -o enemy_fire.wotmod "${WOTSPEAK_AUDIO}enemy_fire.wotmod" || true
          curl -L -s -A "$UA" -o blowupSound.wotmod "${WOTSPEAK_AUDIO}blowupSound.wotmod" || true
          curl -L -s -A "$UA" -o andre_V_UT_announcer.wotmod "${WOTSPEAK_AUDIO}andre_V_UT_announcer.wotmod" || true

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ 5: ПОЛНЫЙ НЕУРЕЗАННЫЙ СПИСОК ЧИТОВ И ЗАПРЕЩЕННЫХ МОДОВ (WotSpeak Core)
          # --------------------------------------------------------------------------------
          echo "Скачивание запрещенных чит-компонентов евро-версии..."
          curl -L -s -A "$UA" -o Tundra.wotmod "${WOTSPEAK_URL}Tundra.wotmod" || true
          curl -L -s -A "$UA" -o WoAA.wotmod "${WOTSPEAK_URL}WoAA.wotmod" || true
          curl -L -s -A "$UA" -o WoRP.wotmod "${WOTSPEAK_URL}WoRP.wotmod" || true
          curl -L -s -A "$UA" -o WoRX.wotmod "${WOTSPEAK_URL}WoRX.wotmod" || true
          curl -L -s -A "$UA" -o WoAD.wotmod "${WOTSPEAK_URL}WoAD.wotmod" || true
          curl -L -s -A "$UA" -o WoH.wotmod "${WOTSPEAK_URL}WoH.wotmod" || true
          curl -L -s -A "$UA" -o WoLP.wotmod "${WOTSPEAK_URL}WoLP.wotmod" || true
          curl -L -s -A "$UA" -o WoRM.wotmod "${WOTSPEAK_URL}WoRM.wotmod" || true
          curl -L -s -A "$UA" -o WoTD.wotmod "${WOTSPEAK_URL}WoTD.wotmod" || true
          curl -L -s -A "$UA" -o WoDO.wotmod "${WOTSPEAK_URL}WoDO.wotmod" || true
          curl -L -s -A "$UA" -o WoMT.wotmod "${WOTSPEAK_URL}WoMT.wotmod" || true
          curl -L -s -A "$UA" -o WoAR.wotmod "${WOTSPEAK_URL}WoAR.wotmod" || true
          curl -L -s -A "$UA" -o WoDS.wotmod "${WOTSPEAK_URL}WoDS.wotmod" || true
          curl -L -s -A "$UA" -o WoGS.wotmod "${WOTSPEAK_URL}WoGS.wotmod" || true
          curl -L -s -A "$UA" -o mod_aim_drw.wotmod "${WOTSPEAK_URL}mod_aim_drw.wotmod" || true
          curl -L -s -A "$UA" -o mod_xray_drw.wotmod "${WOTSPEAK_URL}mod_xray_drw.wotmod" || true
          curl -L -s -A "$UA" -o WoSS.wotmod "${WOTSPEAK_URL}WoSS.wotmod" || true
          curl -L -s -A "$UA" -o WoDOT.wotmod "${WOTSPEAK_URL}WoDOT.wotmod" || true
          curl -L -s -A "$UA" -o WoRT.wotmod "${WOTSPEAK_URL}WoRT.wotmod" || true
          
          echo "=== Все файлы сборки успешно скачаны роботом! ==="

      - name: Push Updates to serg780812-dot/speakwot-repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Smart SpeakWot Robot"
          git add *.wotmod
          if git diff --cached --quiet; then
            echo "Изменений в модах не обнаружено. База данных репозитория стабильна."
          else
            echo "Обновление модов завершено! Заливаем файлы..."
            git commit -m "Робот: Полное скачивание и обновление всех модов под патч ${CURRENT_PATCH}"
            git push
          fi
