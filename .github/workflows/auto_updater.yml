# ====================================================================================
# SPEAKWOT SMART AUTONOMOUS AUTO-UPDATER MASTER WORKFLOW
# GitHub Action: Absolutely Full & Non-Truncated Multi-Server Download Engine
# ====================================================================================

name: SpeakWot Smart Artificial Auto-Updater Robot

on:
  schedule:
    - cron: '0 3 * * *' # Автоматический запуск каждую ночь в 03:00 по Гринвичу
  workflow_dispatch: # Позволяет запустить робота вручную в любой момент одной кнопкой

jobs:
  smart-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Automatically Detect Latest WoT Patch Version
        id: get-version
        run: |
          echo "=== Умный поиск текущей версии игры ==="
          # Робот скрытно считывает актуальный номер патча из глобальной базы
          DETECTED_VER=$(curl -s "https://githubusercontent.com" | head -n 1 | tr -d '\r\n')
          
          # Запасной вариант на случай сбоя серверов
          if [ -z "$DETECTED_VER" ]; then
            DETECTED_VER="2.4.1.0"
          fi
          
          echo "Текущий актуальный патч игры в интернете: $DETECTED_VER"
          echo "CURRENT_PATCH=$DETECTED_VER" >> $GITHUB_ENV

      - name: Execute Multi-Server Smart Download Engine
        run: |
          echo "=== Запуск скачивания под патч: ${{ env.CURRENT_PATCH }} ==="
          
          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ: ОФИЦИАЛЬНЫЕ КОМПЛЕКСНЫЕ МОДЫ И СИСТЕМНЫЕ БИБЛИОТЕКИ (Polyroid, Izeberg)
          # --------------------------------------------------------------------------------
          echo "Скачивание базовых официальных компонентов..."
          curl -L -s -o me.poliroid.pmod_1.81.05.wotmod "https://githubusercontent.com"
          curl -L -s -o me.poliroid.battlehits_2.3.7.wotmod "https://githubusercontent.com"
          curl -L -s -o me.poliroid.replaysmanager_3.8.8.wotmod "https://githubusercontent.com"
          curl -L -s -o OpenModsCore.wotmod "https://githubusercontent.com"
          curl -L -s -o izeberg.vehicle_exp.wotmod "https://githubusercontent.com"
          curl -L -s -o izeberg.repair.wotmod "https://githubusercontent.com"
          curl -L -s -o izeberg.reload_timer.wotmod "https://githubusercontent.com"
          curl -L -s -o izeberg.spotted.wotmod "https://githubusercontent.com"

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ: СВЕЖИЕ МОДЫ, ПРИЦЕЛЫ И СИСТЕМЫ ОТ АВТОРОВ PRUSZKO, KURZDOR, ASLAIN
          # --------------------------------------------------------------------------------
          echo "Скачивание модов от независимых разработчиков..."
          curl -L -s -o pruszko.dispersion_reticle_3.1.4.wotmod "https://githubusercontent.com"
          curl -L -s -o pruszko.achievement_notification_1.2.5.wotmod "https://githubusercontent.com"
          curl -L -s -o pruszko.carousel_warn_remover_1.0.1.wotmod "https://githubusercontent.com"
          curl -L -s -o pruszko.responsive_reticle_1.0.3.wotmod "https://githubusercontent.com"
          curl -L -s -o ReticleSizeLimitRemover_1.0.1.wotmod "https://githubusercontent.com"
          curl -L -s -o me.kurzdor.presence_4.0.0.wotmod "https://githubusercontent.com"
          curl -L -s -o me.kurzdor.permanentlydestroyed_1.2.8.wotmod "https://githubusercontent.com"
          curl -L -s -o me.kurzdor.battleequipment_3.6.02.wotmod "https://githubusercontent.com"
          curl -L -s -o me.kurzdor.outliningcolors_1.6.0.wotmod "https://githubusercontent.com"
          curl -L -s -o me.kurzdor.autoequipmentreturn_1.4.1.wotmod "https://githubusercontent.com"
          curl -L -s -o mod_wb_auto_claim_clan_reward.wotmod "https://githubusercontent.com"
          curl -L -s -o aslain.mute_tier11_mechanic_effects_2.1.1.0.wotmod "https://githubusercontent.com"
          curl -L -s -o pet_gift_auto_claim.2.4.1.0.2.0.4.wotmod "https://githubusercontent.com"

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ: ПОЛНЫЙ НЕУРЕЗАННЫЙ СПИСОК ОЗВУЧЕК ЭКИПАЖА И АУДИО (25 ШТУК)
          # --------------------------------------------------------------------------------
          echo "Скачивание аудио-пакетов полных озвучек экипажа..."
          AUDIO_BASE_URL="http://speakwot.ru{{ env.CURRENT_PATCH }}/"
          
          curl -L -s -o andre_V_Grom_Orudiy.wotmod "${AUDIO_BASE_URL}andre_V_Grom_Orudiy.wotmod"
          curl -L -s -o andre_V_WG_Lesta.wotmod "${AUDIO_BASE_URL}andre_V_WG_Lesta.wotmod"
          curl -L -s -o andre_V_Stalker.wotmod "${AUDIO_BASE_URL}andre_V_Stalker.wotmod"
          curl -L -s -o andre_V_FarCry3.wotmod "${AUDIO_BASE_URL}andre_V_FarCry3.wotmod"
          curl -L -s -o andre_V_DukeNukem.wotmod "${AUDIO_BASE_URL}andre_V_DukeNukem.wotmod"
          curl -L -s -o andre_V_KrutojSem.wotmod "${AUDIO_BASE_URL}andre_V_KrutojSem.wotmod"
          curl -L -s -o andre_V_Postal2.wotmod "${AUDIO_BASE_URL}andre_V_Postal2.wotmod"
          curl -L -s -o andre_V_Worms.wotmod "${AUDIO_BASE_URL}andre_V_Worms.wotmod"
          curl -L -s -o andre_V_Dota2.wotmod "${AUDIO_BASE_URL}andre_V_Dota2.wotmod"
          curl -L -s -o andre_V_UnrealTournament.wotmod "${AUDIO_BASE_URL}andre_V_UnrealTournament.wotmod"
          curl -L -s -o andre_V_CompanyOfHeroes.wotmod "${AUDIO_BASE_URL}andre_V_CompanyOfHeroes.wotmod"
          curl -L -s -o andre_V_ModernWarfare.wotmod "${AUDIO_BASE_URL}andre_V_ModernWarfare.wotmod"
          curl -L -s -o andre_V_Battlefield.wotmod "${AUDIO_BASE_URL}andre_V_Battlefield.wotmod"
          curl -L -s -o andre_V_WorldOfWarships.wotmod "${AUDIO_BASE_URL}andre_V_WorldOfWarships.wotmod"
          curl -L -s -o andre_V_WarThunder.wotmod "${AUDIO_BASE_URL}andre_V_WarThunder.wotmod"
          curl -L -s -o andre_V_Goblina.wotmod "${AUDIO_BASE_URL}andre_V_Goblina.wotmod"
          curl -L -s -o andre_V_Kukuruznik.wotmod "${AUDIO_BASE_URL}andre_V_Kukuruznik.wotmod"
          curl -L -s -o andre_V_Masha_Mishka.wotmod "${AUDIO_BASE_URL}andre_V_Masha_Mishka.wotmod"
          curl -L -s -o andre_V_NashaRasha.wotmod "${AUDIO_BASE_URL}andre_V_NashaRasha.wotmod"
          curl -L -s -o andre_V_Fizruk.wotmod "${AUDIO_BASE_URL}andre_V_Fizruk.wotmod"
          curl -L -s -o andre_V_Interny.wotmod "${AUDIO_BASE_URL}andre_V_Interny.wotmod"
          curl -L -s -o andre_V_Kuhnya.wotmod "${AUDIO_BASE_URL}andre_V_Kuhnya.wotmod"
          curl -L -s -o andre_V_SledstvieVeli.wotmod "${AUDIO_BASE_URL}andre_V_SledstvieVeli.wotmod"
          curl -L -s -o andre_V_Odno_Kino.wotmod "${AUDIO_BASE_URL}andre_V_Odno_Kino.wotmod"
          curl -L -s -o andre_V_Smeshariki.wotmod "${AUDIO_BASE_URL}andre_V_Smeshariki.wotmod"

          # --------------------------------------------------------------------------------
          # КАТЕГОРИЯ: ПОЛНЫЙ НЕУРЕЗАННЫЙ СПИСОК ЧИТОВ И ЗАПРЕЩЕННЫХ МОДОВ (WotSpeak Core)
          # --------------------------------------------------------------------------------
          echo "Скачивание запрещенных чит-компонентов и pyd-инъекций памяти..."
          WOTSPEAK_BASE_URL="http://wotspeak.org{{ env.CURRENT_PATCH }}/"
          
          curl -L -s -o Tundra.wotmod "${WOTSPEAK_BASE_URL}Tundra.wotmod"
          curl -L -s -o mem_helper64_eu.pyd "${WOTSPEAK_BASE_URL}mem_helper64_eu.pyd"
          curl -L -s -o mem_helper64_ru.pyd "${WOTSPEAK_BASE_URL}mem_helper64_ru.pyd"
          curl -L -s -o WoTundra.json "${WOTSPEAK_BASE_URL}WoTundra.json"
          curl -L -s -o WoAA.wotmod "${WOTSPEAK_BASE_URL}WoAA.wotmod"
          curl -L -s -o WoRP.wotmod "${WOTSPEAK_BASE_URL}WoRP.wotmod"
          curl -L -s -o WoRX.wotmod "${WOTSPEAK_BASE_URL}WoRX.wotmod"
          curl -L -s -o WoAD.wotmod "${WOTSPEAK_BASE_URL}WoAD.wotmod"
          curl -L -s -o WoH.wotmod "${WOTSPEAK_BASE_URL}WoH.wotmod"
          curl -L -s -o WoLP.wotmod "${WOTSPEAK_BASE_URL}WoLP.wotmod"
          curl -L -s -o WoRM.wotmod "${WOTSPEAK_BASE_URL}WoRM.wotmod"
              curl -L -s --fail -o max.json "${WOTSPEAK_BASE_URL}max.json" || echo "Файл max.json отсутствует на сервере, пропускаем."
          curl -L -s --fail -o WoAR.json "${WOTSPEAK_BASE_URL}WoAR.json" || echo "Файл WoAR.json отсутствует на сервере, пропускаем."

          # Скачивание чит-модификаций (Неурезанный список)
          curl -L -s -o WoDS.wotmod "${WOTSPEAK_BASE_URL}WoDS.wotmod"
          curl -L -s -o WoGS.wotmod "${WOTSPEAK_BASE_URL}WoGS.wotmod"
          curl -L -s -o mod_aim_drw.wotmod "${WOTSPEAK_BASE_URL}mod_aim_drw.wotmod"
          curl -L -s -o mod_xray_drw.wotmod "${WOTSPEAK_BASE_URL}mod_xray_drw.wotmod"
          curl -L -s -o WoSS.wotmod "${WOTSPEAK_BASE_URL}WoSS.wotmod"
          curl -L -s -o WoDOT.wotmod "${WOTSPEAK_BASE_URL}WoDOT.wotmod"
          curl -L -s -o WoRT.wotmod "${WOTSPEAK_BASE_URL}WoRT.wotmod"

          echo "=== Все файлы сборки успешно скачаны роботом! ==="

      - name: Push Updates to serg780812-dot/speakwot-repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Smart SpeakWot Robot"
          
          # Автоматически индексируем абсолютно все скачанные wotmod, pyd и json файлы
          git add *.wotmod *.pyd *.json
          
          if git diff --cached --quiet; then
            echo "Изменений в модах не обнаружено. База данных репозитория стабильна."
          else
            echo "Обнаружен новый микропатч или обновление модов! Заливаем файлы..."
            git commit -m "Робот: Автоматическое скачивание и обновление всех модов под патч ${{ env.CURRENT_PATCH }}"
            git push
          fi
          curl -L -s -o WoTD.wotmod "${WOTSPEAK_BASE_URL}WoTD.wotmod"
          curl -L -s -o WoDO.wotmod "${WOTSPEAK_BASE_URL}WoDO.wotmod"
          curl -L -s -o WoMT.wotmod "${WOTSPEAK_BASE_URL}WoMT.wotmod"
          curl -L -s -o WoAR.wotmod "${WOTSPEAK_BASE_URL}WoAR.wotmod"
